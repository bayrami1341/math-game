<svg class="station-svg tower-svg state-done" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="twr-done-dish" cx="45%" cy="45%" r="55%">
            <stop offset="0%" stop-color="#5ee0b5" stop-opacity="0.75"/>
            <stop offset="60%" stop-color="#174843" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#0c2624" stop-opacity="1"/>
          </radialGradient>
        </defs>
        
        <!-- فونداسیون ایزومتریک هشت‌ضلعی برج ارتباط -->
        <ellipse cx="100" cy="166" rx="64" ry="12" fill="#5ee0b5" fill-opacity="0.15"/>
        <polygon points="36,154 100,170 164,154 148,142 52,142" fill="#113532" stroke="#5ee0b5" stroke-width="2.2" stroke-linejoin="round"/>
        <polygon points="36,154 100,170 100,177 36,161" fill="#0c2624" stroke="#5ee0b5" stroke-width="2" stroke-linejoin="round"/>
        <polygon points="164,154 100,170 100,177 164,161" fill="#174843" stroke="#5ee0b5" stroke-width="2" stroke-linejoin="round"/>
        <!-- پایه‌های مهار و ستون‌های دکل مخابراتی -->
        <polygon points="62,152 78,78 100,84 88,158" fill="#113532" stroke="#5ee0b5" stroke-width="2.2" stroke-linejoin="round"/>
        <polygon points="138,152 122,78 100,84 112,158" fill="#0c2624" stroke="#5ee0b5" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- سازه مشبک و ضربدری میانی دکل -->
        <line x1="74" y1="98" x2="126" y2="98" stroke="#5ee0b5" stroke-width="2.4"/>
        <line x1="68" y1="124" x2="132" y2="124" stroke="#5ee0b5" stroke-width="2.4"/>
        <line x1="78" y1="78" x2="126" y2="98" stroke="#1d4358" stroke-width="2"/>
        <line x1="122" y1="78" x2="74" y2="98" stroke="#1d4358" stroke-width="2"/>
        <line x1="74" y1="98" x2="132" y2="124" stroke="#1d4358" stroke-width="2"/>
        <line x1="126" y1="98" x2="68" y2="124" stroke="#1d4358" stroke-width="2"/>
        <!-- لوله موج‌بر عمودی و هسته مرکزی فرستنده -->
        <line x1="100" y1="78" x2="100" y2="156" stroke="#5ee0b5" stroke-width="3.5" stroke-opacity="0.95"/>
        <circle cx="100" cy="112" r="11" fill="#071427" stroke="#5ee0b5" stroke-width="2.2"/>
        <circle cx="100" cy="112" r="6" fill="#5ee0b5" fill-opacity="0.95"/>
        <!-- بوسترهای سیگنال کناری روی دکل -->
        <rect x="60" y="104" width="7" height="16" rx="3" fill="#7ef0ff" fill-opacity="0.95" stroke="#5ee0b5" stroke-width="1.4"/>
        <rect x="133" y="104" width="7" height="16" rx="3" fill="#7ef0ff" fill-opacity="0.95" stroke="#5ee0b5" stroke-width="1.4"/>
        <!-- اتاقک کنترل ایزومتریک زیر آنتن -->
        <polygon points="68,72 100,64 132,72 100,80" fill="#174843" stroke="#5ee0b5" stroke-width="2"/>
        <polygon points="68,72 100,80 100,90 68,82" fill="#113532" stroke="#5ee0b5" stroke-width="2"/>
        <polygon points="132,72 100,80 100,90 132,82" fill="#0c2624" stroke="#5ee0b5" stroke-width="2"/>
        <rect x="76" y="75" width="14" height="4" rx="2" fill="#5ee0b5" fill-opacity="0.95"/>
        <circle cx="114" cy="78" r="2.2" fill="#7ef0ff" fill-opacity="0.95"/>
        <circle cx="122" cy="76" r="2.2" fill="#5ee0b5" fill-opacity="0.95"/>
        <!-- بشقاب سهموی آنتن ارتباط با زمین -->
        <ellipse cx="96" cy="46" rx="38" ry="22" transform="rotate(-24 96 46)" fill="url(#twr-done-dish)" stroke="#5ee0b5" stroke-width="2.6"/>
        <ellipse cx="96" cy="46" rx="24" ry="13" transform="rotate(-24 96 46)" fill="none" stroke="#5ee0b5" stroke-width="1.6" stroke-opacity="0.95"/>
        <!-- بازوی کانونی و گوی فرستنده دیش -->
        <line x1="88" y1="50" x2="114" y2="30" stroke="#5ee0b5" stroke-width="3" stroke-linecap="round"/>
        <line x1="104" y1="58" x2="114" y2="30" stroke="#5ee0b5" stroke-width="2" stroke-linecap="round"/>
        <circle cx="116" cy="28" r="6.5" fill="#5ee0b5" stroke="#5ee0b5" stroke-width="2"/>
        
      <g class="signal-waves" stroke="#5ee0b5" fill="none" stroke-linecap="round">
        <path d="M 122 34 A 22 22 0 0 1 142 54" stroke-width="3" stroke-opacity="0.9"/>
        <path d="M 128 24 A 34 34 0 0 1 154 50" stroke-width="2.4" stroke-opacity="0.65"/>
        <path d="M 134 14 A 46 46 0 0 1 166 46" stroke-width="1.8" stroke-opacity="0.4"/>
      </g>
    
      </svg>
