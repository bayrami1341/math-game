<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>میز صبح معلم — روشا</title>
  <style>
    :root {
      --bg: #fcfbf7;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --accent: #b45309;
      --text: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; font-family: Tahoma, 'Segoe UI', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      line-height: 1.6;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .header h1 {
      margin: 0;
      color: var(--accent);
      font-size: 26px;
    }
    .header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 24px;
    }
    .stage-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }
    .stage-box {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .stage-box.active {
      border-color: var(--accent);
      background: #fffbeb;
    }
    .stage-box input { display: none; }
    .stage-box h3 { margin: 0 0 6px; font-size: 16px; color: var(--accent); }
    .stage-box p { margin: 0; font-size: 12px; color: var(--muted); }
    .control-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    input[type="text"], select {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .link-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .link-box {
      flex: 1;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 13px;
      direction: ltr;
      text-align: left;
      overflow-x: auto;
      white-space: nowrap;
    }
    .columns-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .column {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-height: 240px;
    }
    .column h4 {
      margin: 0 0 12px;
      font-size: 15px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }
    .col-red h4 { color: #dc2626; border-color: #fca5a5; }
    .col-amber h4 { color: #d97706; border-color: #fcd34d; }
    .col-green h4 { color: #16a34a; border-color: #86efac; }
    .student-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .student-item .diag {
      font-size: 12px;
      color: #b45309;
      margin-top: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>میز صبح معلم</h1>
      <p>روشا — حلقهٔ ضرب کتاب سوم • سه فهرست و یک جمله، نه نمودار و نه درصد</p>
    </div>

    <div class="card">
      <div class="stage-options">
        <label class="stage-box active" onclick="selectStage('niroogah', this)">
          <input type="radio" name="stage" value="niroogah" checked>
          <h3>⚡ نیروگاه</h3>
          <p>صفحهٔ ۱۰ و ۶۴ تا ۶۹<br>دسته‌ها، آرایه، جدول پایه‌ای</p>
        </label>
        <label class="stage-box" onclick="selectStage('borj', this)">
          <input type="radio" name="stage" value="borj">
          <h3>🏗️ برج</h3>
          <p>صفحهٔ ۷۰ تا ۷۲<br>جابه‌جایی و شکستن ضرب</p>
        </label>
        <label class="stage-box" onclick="selectStage('sakkoo', this)">
          <input type="radio" name="stage" value="sakkoo">
          <h3>📦 سکو</h3>
          <p>صفحهٔ ۱۳۶ تا ۱۴۴<br>بسته‌های ده‌تایی و ارزش مکانی</p>
        </label>
      </div>

      <div class="control-row">
        <input type="text" id="className" value="یاسر" placeholder="کد یا نام کلاس">
        <select id="mode">
          <option value="home">خانه (عصر)</option>
          <option value="school">مدرسه (کلاس)</option>
        </select>
        <button class="btn" onclick="generateLink()">ساخت پیوند کار امشب</button>
      </div>

      <div class="link-row">
        <div class="link-box" id="linkDisplay">پیوند هنوز ساخته نشده است</div>
        <button class="btn" style="background: #475569;" onclick="copyLink()">کپی پیوند</button>
      </div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h3 style="margin: 0; color: var(--accent);">سه فهرست صبح</h3>
        <button class="btn" style="padding: 6px 12px; font-size: 13px;" onclick="renderDesk()">بازخوانی کارپوشه</button>
      </div>

      <div class="columns-grid">
        <div class="column col-red">
          <h4>۱ — نیامده‌ها (<span id="countPending">۰</span>)</h4>
          <div id="listPending"></div>
        </div>
        <div class="column col-amber">
          <h4>۲ — مانده‌ها (<span id="countStuck">۰</span>)</h4>
          <div id="listStuck"></div>
        </div>
        <div class="column col-green">
          <h4>۳ — تمام (<span id="countDone">۰</span>)</h4>
          <div id="listDone"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentStage = 'niroogah';

    function selectStage(stage, el) {
      currentStage = stage;
      document.querySelectorAll('.stage-box').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      generateLink();
      renderDesk();
    }

    function generateLink() {
      const cls = document.getElementById('className').value.trim() || 'یاسر';
      const mode = document.getElementById('mode').value;
      const url = new URL('student.html', window.location.href);
      url.searchParams.set('class', cls);
      url.searchParams.set('stage', currentStage);
      url.searchParams.set('mode', mode);
      document.getElementById('linkDisplay').textContent = url.href;
    }

    function copyLink() {
      const txt = document.getElementById('linkDisplay').textContent;
      if (txt.startsWith('http')) {
        navigator.clipboard.writeText(txt).then(() => alert('پیوند اختصاصی کپی شد'));
      }
    }

    function renderDesk() {
      const cls = document.getElementById('className').value.trim() || 'یاسر';
      const storageKey = 'rosha_' + encodeURIComponent(cls) + '_' + currentStage;
      const raw = localStorage.getItem(storageKey);

      const listPending = document.getElementById('listPending');
      const listStuck = document.getElementById('listStuck');
      const listDone = document.getElementById('listDone');

      listPending.innerHTML = '';
      listStuck.innerHTML = '';
      listDone.innerHTML = '';

      if (!raw) {
        listPending.innerHTML = '<div class="student-item">هنوز پاسخی در این مرحله ثبت نشده است</div>';
        document.getElementById('countPending').textContent = '۱';
        document.getElementById('countStuck').textContent = '۰';
        document.getElementById('countDone').textContent = '۰';
        return;
      }

      const data = JSON.parse(raw);
      if (data.status === 'done') {
        listDone.innerHTML = '<div class="student-item">⚡ دانش‌آموز (کلاس ' + cls + ')<br><small style="color:#64748b;">تکمیل‌شده در ' + new Date(data.updatedAt).toLocaleTimeString('fa-IR') + '</small></div>';
        document.getElementById('countDone').textContent = '۱';
        document.getElementById('countStuck').textContent = '۰';
        document.getElementById('countPending').textContent = '۰';
      } else if (data.status === 'stuck') {
        listStuck.innerHTML = '<div class="student-item">⚠️ دانش‌آموز (کلاس ' + cls + ')<div class="diag">' + data.diagnostic + '</div></div>';
        document.getElementById('countStuck').textContent = '۱';
        document.getElementById('countDone').textContent = '۰';
        document.getElementById('countPending').textContent = '۰';
      }
    }

    window.onload = function() {
      generateLink();
      renderDesk();
    };
  </script>
</body>
</html>
