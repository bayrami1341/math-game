<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کارگاه ریاضی روشا — پایه سوم</title>
  <style>
    :root {
      --bg: #1e293b;
      --panel: #334155;
      --accent: #f59e0b;
      --accent-glow: #fbbf24;
      --text: #f8fafc;
      --success: #10b981;
    }
    * { box-sizing: border-box; font-family: Tahoma, 'Segoe UI', sans-serif; user-select: none; }
    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .workshop-card {
      background: #1e293b;
      border: 3px solid #475569;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.1);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      text-align: center;
      position: relative;
    }
    .station-title {
      color: var(--accent);
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 4px;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }
    .station-subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 18px;
    }
    .meter-display {
      background: #090d16;
      border: 2px solid #334155;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.6);
    }
    .formula {
      font-size: 34px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #f8fafc;
      direction: rtl;
    }
    .sub-split {
      font-size: 15px;
      color: #38bdf8;
      margin-top: 8px;
      background: rgba(56, 189, 248, 0.1);
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-block;
    }
    .fuse-box {
      min-width: 68px;
      height: 52px;
      border: 2px dashed var(--accent);
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-glow);
      font-size: 32px;
      padding: 0 8px;
      transition: all 0.2s;
    }
    .fuse-box.has-val {
      border-style: solid;
      background: rgba(245, 158, 11, 0.25);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .btn-key {
      background: #334155;
      border: none;
      border-bottom: 4px solid #1e293b;
      border-radius: 12px;
      color: #f8fafc;
      font-size: 22px;
      font-weight: bold;
      padding: 13px 0;
      cursor: pointer;
      transition: all 0.1s;
    }
    .btn-key:active {
      transform: translateY(3px);
      border-bottom-width: 1px;
    }
    .btn-key.action-del {
      background: #475569;
      color: #fda4af;
    }
    .btn-submit {
      width: 100%;
      background: var(--accent);
      border: none;
      border-bottom: 4px solid #b45309;
      border-radius: 12px;
      color: #78350f;
      font-size: 19px;
      font-weight: bold;
      padding: 13px;
      cursor: pointer;
      transition: all 0.1s;
    }
    .btn-submit:active {
      transform: translateY(3px);
      border-bottom-width: 1px;
    }
    .hint-panel {
      margin-top: 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      display: none;
    }
    .hint-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      margin-top: 8px;
    }
    .hint-row { display: flex; gap: 6px; }
    .dot-part1 { width: 14px; height: 14px; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 6px #38bdf8; }
    .dot-part2 { width: 14px; height: 14px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }
  </style>
</head>
<body>

  <div class="workshop-card">
    <div class="station-title" id="stageTitle">⚡ کارگاه نیروگاه</div>
    <div class="station-subtitle" id="stageSubtitle">حالت خانه — یک کارِ امروز</div>

    <div class="meter-display">
      <div class="formula">
        <span id="factorA">۴</span>
        <span>×</span>
        <span id="factorB">۵</span>
        <span>=</span>
        <div class="fuse-box" id="ansBox">؟</div>
      </div>
      <div id="splitHint" class="sub-split" style="display: none;"></div>
    </div>

    <div class="keypad">
      <button class="btn-key" onclick="pressKey('1')">۱</button>
      <button class="btn-key" onclick="pressKey('2')">۲</button>
      <button class="btn-key" onclick="pressKey('3')">۳</button>
      <button class="btn-key" onclick="pressKey('4')">۴</button>
      <button class="btn-key" onclick="pressKey('5')">۵</button>
      <button class="btn-key" onclick="pressKey('6')">۶</button>
      <button class="btn-key" onclick="pressKey('7')">۷</button>
      <button class="btn-key" onclick="pressKey('8')">۸</button>
      <button class="btn-key" onclick="pressKey('9')">۹</button>
      <button class="btn-key action-del" onclick="clearKey()">پاک</button>
      <button class="btn-key" onclick="pressKey('0')">۰</button>
      <button class="btn-key action-del" onclick="delKey()">⌫</button>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitAnswer()">اتصال و ثبت</button>

    <div id="hintPanel" class="hint-panel">
      <div id="hintText" style="font-size: 13px; color: #cbd5e1;">به دسته‌ها دقت کن:</div>
      <div id="hintGrid" class="hint-grid"></div>
    </div>
  </div>

  <script>
    const faDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
    function toFa(n) { return String(n).replace(/\d/g, d => faDigits[d]); }
    function toEn(str) { return str.replace(/[۰-۹]/g, d => faDigits.indexOf(d)); }

    const params = new URLSearchParams(window.location.search);
    const stage = params.get('stage') || 'niroogah';

    let a = 4, b = 5, partA1 = 0, partA2 = 0;

    if (stage === 'borj') {
      document.getElementById('stageTitle').innerHTML = '🏗️ کارگاه برج سازه';
      document.getElementById('stageSubtitle').textContent = 'شکستن و جابه‌جایی — یک کارِ امروز';
      document.getElementById('submitBtn').textContent = 'تثبیت ستون و ثبت';
      // ضرب ۷ در ۶ شکسته شده به (۵ در ۶) + (۲ در ۶)
      a = 7; b = 6; partA1 = 5; partA2 = 2;
      const splitEl = document.getElementById('splitHint');
      splitEl.style.display = 'inline-block';
      splitEl.innerHTML = 'راهنما: (' + toFa(partA1) + ' دسته ' + toFa(b) + 'تایی) + (' + toFa(partA2) + ' دسته ' + toFa(b) + 'تایی)';
    }

    document.getElementById('factorA').textContent = toFa(a);
    document.getElementById('factorB').textContent = toFa(b);

    let currentInput = "";
    function pressKey(num) {
      if (currentInput.length >= 3) return;
      currentInput += num;
      updateBox();
    }
    function delKey() { currentInput = currentInput.slice(0, -1); updateBox(); }
    function clearKey() { currentInput = ""; updateBox(); }

    function updateBox() {
      const box = document.getElementById('ansBox');
      if (!currentInput) {
        box.textContent = "؟";
        box.classList.remove('has-val');
      } else {
        box.textContent = toFa(currentInput);
        box.classList.add('has-val');
      }
    }

    function submitAnswer() {
      if (!currentInput) return;
      const val = parseInt(toEn(currentInput), 10);
      const expected = a * b;
      if (val === expected) {
        document.getElementById('ansBox').style.background = "#065f46";
        document.getElementById('ansBox').style.borderColor = "#10b981";
        setTimeout(() => alert("پاسخ درست ثبت شد! کار امروز تمام است."), 200);
      } else {
        renderVisualHint();
      }
    }

    function renderVisualHint() {
      const panel = document.getElementById('hintPanel');
      const grid = document.getElementById('hintGrid');
      grid.innerHTML = '';
      if (stage === 'borj') {
        document.getElementById('hintText').textContent = 'برج به دو بخش تقسیم شده است: آبی (' + toFa(partA1) + '×' + toFa(b) + ') و زرد (' + toFa(partA2) + '×' + toFa(b) + ')';
        for (let r = 0; r < a; r++) {
          const row = document.createElement('div');
          row.className = 'hint-row';
          const dotClass = (r < partA1) ? 'dot-part1' : 'dot-part2';
          for (let c = 0; c < b; c++) {
            const dot = document.createElement('div');
            dot.className = dotClass;
            row.appendChild(dot);
          }
          grid.appendChild(row);
        }
      } else {
        for (let r = 0; r < a; r++) {
          const row = document.createElement('div');
          row.className = 'hint-row';
          for (let c = 0; c < b; c++) {
            const dot = document.createElement('div');
            dot.className = 'dot-part2';
            row.appendChild(dot);
          }
          grid.appendChild(row);
        }
      }
      panel.style.display = 'block';
    }
  </script>
</body>
</html>
