<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کارگاه نیروگاه — روشا</title>
  <style>
    :root {
      --bg: #1e293b;
      --panel: #334155;
      --accent: #f59e0b;
      --accent-glow: #fbbf24;
      --text: #f8fafc;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; font-family: Tahoma, 'Segoe UI', sans-serif; user-select: none; }
    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .workshop-card {
      background: #1e293b;
      border: 3px solid #475569;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.1);
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      text-align: center;
      position: relative;
    }
    .station-title {
      color: var(--accent);
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 4px;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }
    .station-subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .meter-display {
      background: #090d16;
      border: 2px solid #334155;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.6);
    }
    .formula {
      font-size: 38px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #f8fafc;
    }
    .fuse-box {
      min-width: 70px;
      height: 54px;
      border: 2px dashed var(--accent);
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-glow);
      font-size: 34px;
      padding: 0 8px;
      transition: all 0.2s;
    }
    .fuse-box.has-val {
      border-style: solid;
      background: rgba(245, 158, 11, 0.25);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn-key {
      background: #334155;
      border: none;
      border-bottom: 4px solid #1e293b;
      border-radius: 12px;
      color: #f8fafc;
      font-size: 22px;
      font-weight: bold;
      padding: 14px 0;
      cursor: pointer;
      transition: all 0.1s;
    }
    .btn-key:active {
      transform: translateY(3px);
      border-bottom-width: 1px;
    }
    .btn-key.action-del {
      background: #475569;
      color: #fda4af;
    }
    .btn-submit {
      width: 100%;
      background: var(--accent);
      border: none;
      border-bottom: 4px solid #b45309;
      border-radius: 12px;
      color: #78350f;
      font-size: 20px;
      font-weight: bold;
      padding: 14px;
      cursor: pointer;
      transition: all 0.1s;
      margin-top: 6px;
    }
    .btn-submit:active {
      transform: translateY(3px);
      border-bottom-width: 1px;
    }
    .hint-panel {
      margin-top: 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      display: none;
      animation: fadeIn 0.3s;
    }
    .hint-dots {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }
    .hint-row {
      display: flex;
      gap: 8px;
    }
    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <div class="workshop-card">
    <div class="station-title">⚡ کارگاه نیروگاه</div>
    <div class="station-subtitle">حالت خانه — یک کارِ امروز</div>

    <div class="meter-display">
      <div class="formula">
        <span id="factorA">۴</span>
        <span>×</span>
        <span id="factorB">۵</span>
        <span>=</span>
        <div class="fuse-box" id="ansBox">؟</div>
      </div>
    </div>

    <div class="keypad">
      <button class="btn-key" onclick="pressKey('1')">۱</button>
      <button class="btn-key" onclick="pressKey('2')">۲</button>
      <button class="btn-key" onclick="pressKey('3')">۳</button>
      <button class="btn-key" onclick="pressKey('4')">۴</button>
      <button class="btn-key" onclick="pressKey('5')">۵</button>
      <button class="btn-key" onclick="pressKey('6')">۶</button>
      <button class="btn-key" onclick="pressKey('7')">۷</button>
      <button class="btn-key" onclick="pressKey('8')">۸</button>
      <button class="btn-key" onclick="pressKey('9')">۹</button>
      <button class="btn-key action-del" onclick="clearKey()">پاک</button>
      <button class="btn-key" onclick="pressKey('0')">۰</button>
      <button class="btn-key action-del" onclick="delKey()">⌫</button>
    </div>

    <button class="btn-submit" onclick="submitAnswer()">اتصال و ثبت</button>

    <div id="hintPanel" class="hint-panel">
      <div style="font-size: 13px; color: #cbd5e1;">روشن نشد! به دسته‌ها دقت کن:</div>
      <div id="hintDots" class="hint-dots"></div>
    </div>
  </div>

  <script src="rosha-engine.js"></script>
  <script>
    const faDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
    function toFa(n) { return String(n).replace(/\d/g, d => faDigits[d]); }
    function toEn(str) { return str.replace(/[۰-۹]/g, d => faDigits.indexOf(d)); }

    let currentInput = "";
    const a = 4, b = 5;
    document.getElementById('factorA').textContent = toFa(a);
    document.getElementById('factorB').textContent = toFa(b);

    function pressKey(num) {
      if (currentInput.length >= 3) return;
      currentInput += num;
      updateBox();
    }
    function delKey() {
      currentInput = currentInput.slice(0, -1);
      updateBox();
    }
    function clearKey() {
      currentInput = "";
      updateBox();
    }
    function updateBox() {
      const box = document.getElementById('ansBox');
      if (currentInput.length === 0) {
        box.textContent = "؟";
        box.classList.remove('has-val');
      } else {
        box.textContent = toFa(currentInput);
        box.classList.add('has-val');
      }
    }

    function submitAnswer() {
      if (!currentInput) return;
      const num = parseInt(toEn(currentInput), 10);
      if (num === (a * b)) {
        document.getElementById('ansBox').style.background = "#065f46";
        document.getElementById('ansBox').style.borderColor = "#10b981";
        setTimeout(() => alert("نیروگاه روشن شد! کار امروز تمام است."), 200);
      } else {
        showHint();
      }
    }

    function showHint() {
      const panel = document.getElementById('hintPanel');
      const dotsContainer = document.getElementById('hintDots');
      dotsContainer.innerHTML = '';
      for (let r = 0; r < a; r++) {
        const row = document.createElement('div');
        row.className = 'hint-row';
        for (let c = 0; c < b; c++) {
          const dot = document.createElement('div');
          dot.className = 'dot';
          row.appendChild(dot);
        }
        dotsContainer.appendChild(row);
      }
      panel.style.display = 'block';
    }
  </script>
</body>
</html>
