<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کار امروز — روشا</title>
  <style>
    /* کار عصر کودک: یک کار، بدون منو، بدون تایمر، بدون نمره، بدون مقایسه */
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, 'Segoe UI', sans-serif;
      background: #101826; color: #f1f5f9; margin: 0; padding: 16px;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .wrap { width: 100%; max-width: 460px; }
    .head { text-align: center; margin-bottom: 14px; }
    .head .stage { color: #fbbf24; font-size: .85rem; }
    .head .hint { color: #94a3b8; font-size: .75rem; margin-top: 2px; }
    .card {
      background: rgba(30,41,59,.9); border: 1px solid #334155; border-radius: 18px;
      padding: 26px 20px; text-align: center;
    }
    .prompt { font-size: 2.4rem; font-weight: 800; letter-spacing: .04em; margin: 8px 0 18px; direction: ltr; }
    .prompt .q { color: #fbbf24; }
    input.answer {
      font-family: inherit; font-size: 1.6rem; font-weight: 700; text-align: center;
      width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid #475569;
      background: #0f172a; color: #f1f5f9; margin-bottom: 14px; min-height: 56px;
    }
    input.answer:focus { outline: none; border-color: #fbbf24; }
    .actions { display: flex; gap: 10px; }
    button {
      font-family: inherit; font-size: 1rem; padding: 12px 18px; min-height: 52px;
      border: none; border-radius: 12px; cursor: pointer; flex: 1 1 auto;
    }
    button.main { background: #fbbf24; color: #78350f; font-weight: 700; }
    button.soft { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; flex: 0 0 auto; }
    button:disabled { opacity: .5; cursor: default; }
    .feedback { margin-top: 14px; font-size: .95rem; min-height: 1.6em; line-height: 1.9; }
    .feedback.ok { color: #4ade80; }
    .feedback.no { color: #fda4af; }
    .feedback.neutral { color: #94a3b8; }
    .guide {
      margin-top: 14px; padding: 14px; border-radius: 12px; background: rgba(251,191,36,.07);
      border: 1px dashed rgba(251,191,36,.4); font-size: .85rem; color: #fde68a; line-height: 2.2;
      display: none;
    }
    .guide .dots { direction: ltr; font-size: 1.05rem; line-height: 2; letter-spacing: .25em; }
    .namecard input {
      font-family: inherit; font-size: 1.1rem; text-align: center; width: 100%;
      padding: 12px; border-radius: 12px; border: 1.5px solid #475569;
      background: #0f172a; color: #f1f5f9; margin: 12px 0; min-height: 52px;
    }
    .endcard .done-emoji { font-size: 2.4rem; margin-bottom: 6px; }
    .endcard h2 { font-size: 1.15rem; margin: 0 0 8px; color: #fbbf24; }
    .endcard p { color: #cbd5e1; font-size: .88rem; line-height: 2; margin: 0 0 12px; }
    .teacher-card {
      margin-top: 14px; text-align: right; background: rgba(15,23,42,.7);
      border: 1px solid #334155; border-radius: 12px; padding: 12px 14px;
    }
    .teacher-card summary { cursor: pointer; font-size: .82rem; color: #94a3b8; }
    .teacher-card textarea {
      width: 100%; font-family: inherit; font-size: .8rem; background: #0f172a;
      color: #cbd5e1; border: 1px solid #334155; border-radius: 8px; padding: 8px;
      margin-top: 8px; min-height: 88px; resize: vertical;
    }
    .badge {
      display: inline-block; font-size: .68rem; color: #64748b; border: 1px solid #334155;
      border-radius: 999px; padding: 2px 10px; margin-top: 10px;
    }
  </style>
</head>
<body>
  <main class="wrap" id="app">
    <div class="head">
      <div class="stage" id="stageLabel"></div>
      <div class="hint" id="modeLabel"></div>
    </div>
    <div class="card" id="card"><!-- با جاوااسکریپت پر می‌شود --></div>
  </main>

  <script src="rosha-engine.js"></script>
  <script>
  (function () {
    'use strict';
    var R = window.Rosha;

    var params = new URLSearchParams(location.search);
    var classCode = (params.get('class') || '').trim();
    var stageKey = (params.get('stage') || '').trim();
    var mode = params.get('mode') === 'afterclass' ? 'بعد از کلاس' : 'خانه';

    var card = document.getElementById('card');
    var profile = null, win = null, current = null, assistedNow = false;

    function toFa(n) { return String(n).replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[Number(d)]; }); }
    function faToEn(s) {
      return String(s)
        .replace(/[۰-۹]/g, function (d) { return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); })
        .replace(/[٠-٩]/g, function (d) { return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)); });
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // درِ ورودی: این صفحه فقط با پیوند معلم باز می‌شود — منو وجود ندارد
    if (!classCode || !R.stageByKey(stageKey)) {
      document.getElementById('stageLabel').textContent = '';
      card.innerHTML = '<h2 style="font-size:1.1rem;margin:0 0 8px;color:#fbbf24">این صفحه با پیوند معلم باز می‌شود</h2>'
        + '<p style="color:#94a3b8;font-size:.85rem;line-height:2;margin:0">پیوند کار امشب را معلم در گروه کلاس می‌گذارد.</p>';
      return;
    }

    win = R.buildWindow(stageKey);
    var stage = win.stage;
    document.getElementById('stageLabel').textContent = 'کارگاه ' + stage.fa;
    document.getElementById('modeLabel').textContent = 'حالت ' + mode + ' — یک کارِ امروز';

    // ── گام ۱: نام نمایشی (بار اول، روی همین دستگاه) ──
    function askName() {
      card.innerHTML = '<h2 style="font-size:1.05rem;margin:0 0 4px;color:#fbbf24">سلام!</h2>'
        + '<p style="color:#94a3b8;font-size:.85rem;line-height:2;margin:0">اسمت را بنویس تا کارِ امشبت را پیدا کنم.</p>'
        + '<div class="namecard"><input id="childName" maxlength="30" autocomplete="off" placeholder="نام"></div>'
        + '<button class="main" id="startBtn" style="width:100%">شروع کار</button>';
      var input = document.getElementById('childName');
      input.focus();
      document.getElementById('startBtn').addEventListener('click', start);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') start(); });
    }

    function start() {
      var name = document.getElementById('childName').value.trim();
      if (!name) return;
      profile = R.getProfile(classCode, name);
      renderTask();
    }

    // ── گام ۲: یک کار امروز ──
    function renderTask() {
      var pick = R.nextTask(profile, win);
      current = pick.task;
      assistedNow = false;
      if (!current) { renderEnd(pick.reason); return; }

      card.innerHTML = '<div class="prompt">' + escapeHtml(current.prompt.replace('؟', '<span class="q">؟</span>')) + '</div>'
        + '<input class="answer" id="answer" inputmode="numeric" autocomplete="off" placeholder="جواب">'
        + '<div class="actions">'
        + '<button class="main" id="submitBtn">ثبت</button>'
        + '<button class="soft" id="guideBtn">راهنما</button>'
        + '</div>'
        + '<div class="guide" id="guide"></div>'
        + '<div class="feedback" id="feedback"></div>';

      var input = document.getElementById('answer');
      input.focus();
      document.getElementById('submitBtn').addEventListener('click', submit);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
      document.getElementById('guideBtn').addEventListener('click', showGuide);
    }

    // راهنمای محلی: دسته‌های دیدنی — جواب هرگز اینجا نیست
    function showGuide() {
      assistedNow = true;
      var g = document.getElementById('guide');
      var a = current.f1, b = Math.min(current.f2, 12);
      var rows = [];
      for (var i = 0; i < a; i++) {
        var dots = '';
        for (var j = 0; j < b; j++) dots += '●';
        rows.push('<div class="dots">' + dots + '</div>');
      }
      g.innerHTML = 'این‌ها را دسته‌دسته بشمار — هر سطر یک دسته است:'
        + rows.join('')
        + '<div>راهنما جواب را نمی‌گوید؛ شمردن با توست.</div>';
      g.style.display = 'block';
      document.getElementById('guideBtn').disabled = true;
      // راهنما فقط ثبت می‌شود؛ انتقال وضعیت نمی‌دهد (قاعدهٔ §۵)
      R.applyEvent(profile, current, { given: NaN, assisted: true }, stage);
    }

    function submit() {
      var raw = faToEn(document.getElementById('answer').value).trim();
      var fb = document.getElementById('feedback');
      if (raw === '' || !Number.isFinite(Number(raw))) {
        fb.className = 'feedback neutral';
        fb.textContent = 'یک عدد بنویس.';
        return;
      }
      var given = Number(raw);
      var res = R.applyEvent(profile, current, { given: given, assisted: assistedNow }, stage);

      if (res.judged.correct) {
        fb.className = 'feedback ok';
        fb.textContent = 'درست بود!' + (assistedNow ? ' (با راهنما — این یکی برای بستنِ گره حساب نمی‌شود.)' : '');
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('guideBtn').disabled = true;
        setTimeout(renderTask, 1100);
      } else {
        fb.className = 'feedback no';
        fb.textContent = 'روشن نشد. همان جا بمان و دوباره نگاه کن.'; // جواب هرگز گفته نمی‌شود
        // قاعده ادامه کار را تعیین می‌کند: کار همان می‌ماند؛ در نوبت بعدی انتخاب‌گر تصمیم می‌گیرد
      }
    }

    // ── گام ۳: پایان کار (متن پایان سکو = جای خالی معلوم) ──
    function renderEnd(reason) {
      var sentence = R.morningSentence(profile, win);
      card.innerHTML = '<div class="endcard">'
        + '<div class="done-emoji" aria-hidden="true">🌙</div>'
        + '<h2>کار امروز تمام شد</h2>'
        + '<p id="endNote">' + escapeHtml(reason) + '</p>'
        + '<div class="teacher-card"><summary style="display:block;font-size:.82rem;color:#94a3b8">کارت کار برای معلم (داربست)</summary>'
        + '<textarea id="teacherNote" readonly></textarea>'
        + '<button class="soft" id="copyNote" style="width:100%;margin-top:8px">کپی برای معلم</button>'
        + '<span class="badge">داربست — سازوکار نهایی انتقال خبر، جای خالی عمدی است</span>'
        + '</div></div>';
      var text = 'کار: ضرب سوم — ' + stage.fa + '\nکلاس: ' + classCode + '\nکودک: ' + profile.childName
        + '\nجملهٔ صبح: ' + sentence + '\n(پرونده کامل روی دستگاه خودش می‌ماند)';
      document.getElementById('teacherNote').value = text;
      document.getElementById('copyNote').addEventListener('click', function () {
        var t = document.getElementById('teacherNote');
        t.select();
        try { document.execCommand('copy'); } catch (e) { /* بی‌خطر */ }
        if (navigator.clipboard) navigator.clipboard.writeText(t.value);
      });
    }

    askName();
  })();
  </script>
</body>
</html>
