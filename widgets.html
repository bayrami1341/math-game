<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ابزارک‌های کلاس</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 16px;
      text-align: center;
    }
    .back {
      color: #1976D2;
      text-decoration: none;
      font-size: 15px;
      display: inline-block;
      margin-bottom: 12px;
    }
    h1 {
      color: #0d47a1;
      font-size: 22px;
      margin-bottom: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 24px 16px;
      margin: 0 auto 20px;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .card h2 {
      font-size: 18px;
      color: #333;
      margin-bottom: 16px;
    }
    #wheel-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 0 auto;
    }
    canvas {
      display: block;
      border-radius: 50%;
      box-shadow: 0 0 0 8px #fff, 0 0 0 12px #e0e0e0, 0 8px 24px rgba(0,0,0,0.15);
    }
    .pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 28px solid #d32f2f;
      z-index: 10;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
    }
    .spin-btn {
      background: linear-gradient(135deg, #ff9800, #f57c00);
      color: white;
      border: none;
      padding: 14px 40px;
      border-radius: 50px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
      box-shadow: 0 4px 12px rgba(255,152,0,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .spin-btn:active {
      transform: scale(0.96);
    }
    .spin-btn:disabled {
      background: #bbb;
      box-shadow: none;
      cursor: not-allowed;
    }
    #result {
      margin-top: 16px;
      font-size: 20px;
      font-weight: bold;
      color: #0d47a1;
      min-height: 30px;
    }
    .light {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: none;
      margin: 8px;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.12s;
    }
    .light:active { transform: scale(0.9); }
    .g { background: #43a047; }
    .y { background: #fbc02d; }
    .r { background: #e53935; }
    #status {
      margin-top: 12px;
      font-weight: bold;
      font-size: 16px;
      color: #444;
    }
  </style>
</head>
<body>
  <a href="home.html" class="back">← بازگشت</a>
  <h1>ابزارک‌های کلاس</h1>

  <!-- چرخ گردان -->
  <div class="card">
    <h2>چرخ گردان</h2>
    <div id="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="300" height="300"></canvas>
    </div>
    <button class="spin-btn" id="spinBtn" onclick="spin()">بچرخان</button>
    <div id="result">منتظر چرخش...</div>
  </div>

  <!-- چراغ راهنمایی -->
  <div class="card">
    <h2>چراغ راهنمایی</h2>
    <button class="light g" onclick="show('سبز — فهمیدم')">🟢</button>
    <button class="light y" onclick="show('زرد — نصفه')">🟡</button>
    <button class="light r" onclick="show('قرمز — نفهمیدم')">🔴</button>
    <div id="status">انتخاب کنید</div>
  </div>

  <script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    let names = [];
    let angle = 0;
    let spinning = false;

    // صداهای واقعی (تیک و برنده)
    const tickSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3');
    const winSound  = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3');
    tickSound.volume = 0.35;
    winSound.volume = 0.5;

    function loadNames() {
      const scores = JSON.parse(localStorage.getItem('demo_scores') || '[]');
      names = scores.map(s => s.name).filter(Boolean);
      if (names.length === 0) {
        names = ['علی', 'زهرا', 'محمد', 'فاطمه', 'امیر', 'نرگس', 'حسین'];
      }
      drawWheel();
    }

    function drawWheel() {
      const n = names.length;
      const arc = (2 * Math.PI) / n;
      const colors = [
        '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4',
        '#FFEAA7', '#DDA0DD', '#98D8C8', '#F7DC6F',
        '#FF9F43', '#54A0FF'
      ];

      ctx.clearRect(0, 0, 300, 300);

      // رسم قطاع‌ها
      for (let i = 0; i < n; i++) {
        const start = i * arc + angle;
        const end = start + arc;

        ctx.beginPath();
        ctx.moveTo(150, 150);
        ctx.arc(150, 150, 140, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();

        // خط جداکننده
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // متن — دقیقاً وسط قطاع
        ctx.save();
        ctx.translate(150, 150);
        ctx.rotate(start + arc / 2);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#1a1a1a';
        ctx.font = 'bold 15px Tahoma';
        // فاصله از مرکز تا وسط قطاع (حدود ۷۵ پیکسل)
        ctx.fillText(names[i], 78, 0);
        ctx.restore();
      }

      // دایره وسط
      ctx.beginPath();
      ctx.arc(150, 150, 22, 0, 2 * Math.PI);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = '#ddd';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    function spin() {
      if (spinning) return;
      spinning = true;
      spinBtn.disabled = true;
      document.getElementById('result').textContent = 'در حال چرخش...';

      const extra = 1800 + Math.random() * 900; // چند دور کامل + تصادفی
      const duration = 4800;
      const startTime = performance.now();
      let lastTick = 0;

      function animate(now) {
        const t = Math.min((now - startTime) / duration, 1);
        // ease-out قوی
        const ease = 1 - Math.pow(1 - t, 4.5);
        angle = (extra * ease * Math.PI) / 180;
        drawWheel();

        // صدای تیک
        if (now - lastTick > 90 && t < 0.88) {
          try {
            tickSound.currentTime = 0;
            tickSound.play();
          } catch (e) {}
          lastTick = now;
        }

        if (t < 1) {
          requestAnimationFrame(animate);
        } else {
          spinning = false;
          spinBtn.disabled = false;

          // محاسبه نام برنده
          const n = names.length;
          const arc = (2 * Math.PI) / n;
          const normalized = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
          // چون فلش بالا است، معکوس می‌کنیم
          const index = Math.floor(((2 * Math.PI - normalized) % (2 * Math.PI)) / arc) % n;

          document.getElementById('result').textContent = '🎉 انتخاب شد: ' + names[index];
          try { winSound.play(); } catch (e) {}
        }
      }
      requestAnimationFrame(animate);
    }

    function show(t) {
      document.getElementById('status').textContent = t;
    }

    // شروع
    loadNames();
  </script>
</body>
</html>
