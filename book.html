<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کتاب کامل ریاضی سوم — کارگاه ضرب</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, 'Segoe UI', sans-serif; margin: 0; padding: 16px; min-height: 100vh;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); color: #f1f5f9;
    }
    .shell { max-width: 860px; margin: 0 auto; }
    h1 { text-align: center; color: #fbbf24; font-size: 1.45rem; margin: 10px 0 4px; }
    .subtitle { text-align: center; color: #94a3b8; font-size: .85rem; margin: 0 0 18px; }
    .top-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
    .btn {
      display: inline-block; padding: 9px 16px; border-radius: 12px; text-decoration: none;
      font-size: .85rem; font-weight: bold; border: 1px solid #475569; color: #f1f5f9; background: rgba(51,65,85,.6);
      cursor: pointer;
    }
    .btn.primary { background: #f59e0b; border-color: #f59e0b; color: #1e293b; }
    .unit-title { color: #fde68a; font-size: .95rem; margin: 18px 4px 10px; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
    .lesson {
      background: rgba(30,41,59,.9); border: 1px solid #334155; border-radius: 14px;
      padding: 12px; cursor: pointer; transition: transform .12s ease, border-color .12s ease;
      display: flex; flex-direction: column; gap: 6px; text-align: right;
    }
    .lesson:hover { transform: translateY(-2px); border-color: #fbbf24; }
    .lesson .num { font-size: .7rem; color: #64748b; }
    .lesson .title { font-weight: bold; font-size: .9rem; line-height: 1.7; }
    .lesson .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .7rem; }
    .chip { border-radius: 999px; padding: 2px 8px; font-size: .65rem; }
    .chip.ok { background: rgba(52,211,153,.15); color: #34d399; border: 1px solid rgba(52,211,153,.4); }
    .chip.draft { background: rgba(251,191,36,.12); color: #fbbf24; border: 1px solid rgba(251,191,36,.4); }
    .stars { color: #fbbf24; font-size: .8rem; }
    .best { color: #94a3b8; font-size: .7rem; }
    /*Quiz*/
    .quiz-card {
      background: rgba(30,41,59,.92); border: 1px solid #334155; border-radius: 16px;
      padding: 20px; max-width: 560px; margin: 0 auto;
    }
    .qbar { height: 8px; background: #334155; border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
    .qbar > span { display: block; height: 100%; background: #34d399; transition: width .2s; }
    .qhead { display: flex; justify-content: space-between; font-size: .75rem; color: #94a3b8; margin-bottom: 8px; }
    .qtext { font-size: 1.15rem; font-weight: bold; line-height: 2.1; margin-bottom: 14px; min-height: 3.2rem; }
    .visual { font-size: 1.5rem; line-height: 2; letter-spacing: .2rem; margin-bottom: 12px; text-align: center; }
    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .opt {
      padding: 14px 10px; border-radius: 12px; border: 1px solid #475569; background: rgba(51,65,85,.5);
      color: #f1f5f9; font-size: 1.05rem; cursor: pointer; font-family: inherit;
    }
    .opt:hover { border-color: #fbbf24; }
    .opt.correct { background: rgba(52,211,153,.25); border-color: #34d399; }
    .opt.wrong { background: rgba(251,113,133,.22); border-color: #fb7185; }
    .numrow { display: flex; gap: 10px; }
    .numrow input {
      flex: 1; padding: 13px; border-radius: 12px; border: 1px solid #475569; background: #0f172a;
      color: #f1f5f9; font-size: 1.2rem; text-align: center; font-family: inherit;
    }
    .numrow button { padding: 0 22px; }
    .feedback { min-height: 2.4rem; margin-top: 12px; font-size: .95rem; font-weight: bold; line-height: 1.9; }
    .feedback.good { color: #34d399; }
    .feedback.bad { color: #fb7185; }
    .nextbtn { margin-top: 6px; width: 100%; padding: 13px; display: none; }
    /*Result*/
    .result { text-align: center; padding: 26px 12px; }
    .result .big { font-size: 3rem; }
    .result .score { font-size: 1.3rem; color: #fbbf24; font-weight: bold; margin: 10px 0; }
    .result .msg { color: #94a3b8; font-size: .9rem; line-height: 2; margin-bottom: 16px; }
    .hidden { display: none; }
    @media (max-width: 480px) { .opts { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <h1>📚 کتاب کامل ریاضی سوم</h1>
    <p class="subtitle">هر ۱۶ درسِ نقشهٔ کتاب — تمرین کوتاه ۸ سؤالی برای هر درس</p>
    <div class="top-actions">
      <a class="btn primary" href="v10.html">🚀 ایستگاه ضرب</a>
      <a class="btn" href="leaderboard.html">🏅 لیدربرد</a>
      <a class="btn" href="home.html">🏠 خانه</a>
    </div>
    <div id="app" aria-live="polite"></div>
  </div>

  <script>
  'use strict';
  // ───────────────────────── داده‌های درس (هم‌نام با خشاب KH-G3-MATH) ─────────────────────────
  const LESSONS = [
    { id: 'L-PRE', title: 'الگوها و شمارش چندتا‌چندتا', unit: 'شروع', draft: false },
    { id: 'L-41',  title: 'دسته‌های مساوی و آرایه', unit: 'فصل ضرب ۱', draft: false },
    { id: 'L-42',  title: 'جمع تکراری و نماد ضرب', unit: 'فصل ضرب ۱', draft: false },
    { id: 'L-43',  title: 'جدول ضرب یک‌رقم در یک‌رقم', unit: 'فصل ضرب ۱', draft: false },
    { id: 'L-44',  title: 'جابه‌جایی و شکستن یک عامل', unit: 'فصل ضرب ۱', draft: false },
    { id: 'L-81',  title: 'ضرب در صفر، یک و ۱۰', unit: 'فصل ضرب ۲', draft: false },
    { id: 'L-82',  title: 'یک‌رقم در دورقمی و سه‌رقمی', unit: 'فصل ضرب ۲', draft: false },
    { id: 'L-83',  title: 'تقریب برای وارسی', unit: 'فصل ضرب ۲', draft: false },
    { id: 'L-D1',  title: 'تقسیم بدون باقیمانده', unit: 'تقسیم', draft: false },
    { id: 'L-D2',  title: 'تقسیم با باقیمانده', unit: 'تقسیم', draft: false },
    { id: 'L-A1',  title: 'عددهای چهاررقمی', unit: 'عدد و محاسبه', draft: true },
    { id: 'L-A2',  title: 'جمع و تفریق عددهای چهاررقمی', unit: 'عدد و محاسبه', draft: true },
    { id: 'L-B1',  title: 'محور و کسر', unit: 'کسر', draft: true },
    { id: 'L-C1',  title: 'هندسه: شکل‌ها، محیط و تقارن', unit: 'هندسه', draft: true },
    { id: 'L-E1',  title: 'اندازه‌گیری (عددهای مرکب)', unit: 'اندازه‌گیری', draft: true },
    { id: 'L-F1',  title: 'آمار و احتمال', unit: 'آمار و احتمال', draft: true },
  ];
  const QCOUNT = 8;
  const STORE_KEY = 'kargar_book_v1';

  const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const en = (s) => String(s).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = (arr) => arr.map((v) => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(([, v]) => v);

  // نام فارسی عددهای چهاررقمی (۱۰۰۰ تا ۹۹۹۹)
  const ONES = ['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];
  const TEENS = ['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
  const TENS = ['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
  const HUNDREDS = ['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
  function under1000(n) {
    let parts = [];
    const h = Math.floor(n / 100), r = n % 100;
    if (h) parts.push(HUNDREDS[h]);
    if (r >= 20) { const t = Math.floor(r / 10), o = r % 10; parts.push(TENS[t] + (o ? ' و ' + ONES[o] : '')); }
    else if (r >= 10) parts.push(TEENS[r - 10]);
    else if (r > 0) parts.push(ONES[r]);
    return parts.join(' و ');
  }
  function faName(n) { const th = Math.floor(n / 1000), r = n % 1000; let s = ONES[th] + ' هزار'; if (r) s += ' و ' + under1000(r); return s; }

  // ───────────────────────── مولّد سؤال هر درس ─────────────────────────
  // هر مولّد: آرایه‌ای از سؤال‌ها؛ هر سؤال {text, visual?, answer, options?, hint?}
  function gen(lessonId) {
    const q = [];
    const num = (text, answer, hint) => q.push({ type: 'num', text, answer: String(answer), hint });
    const mcq = (text, correct, wrongs, hint) => q.push({ type: 'mcq', text, answer: String(correct), options: shuffle([String(correct), ...wrongs.map(String)]), hint });

    switch (lessonId) {
      case 'L-PRE': {
        for (let k = 0; k < 3; k++) { const a = ri(1, 4), b = ri(2, 5); num(`الگو را ادامه بده: ${fa(a)} ، ${fa(a+b)} ، ${fa(a+2*b)} ، ؟`, a + 3*b, `هر بار ${fa(b)} تا اضافه می‌شود.`); }
        for (let k = 0; k < 3; k++) { const a = ri(2, 6), b = ri(2, 6); num(`${fa(a)} دستهٔ ${fa(b)}تایی چندتا می‌شود؟`, a*b, 'چندتا‌چندتا بشمار.'); }
        { const b = ri(2, 5); mcq(`در شمارشِ ${fa(b)}تا${fa(b)}تا، عدد بعدی کدام است؟ ${fa(b)} ، ${fa(2*b)} ، ${fa(3*b)} ، ...`, 4*b, [4*b+1, 4*b-1, 4*b+2]); }
        { const a = ri(3, 6), b = ri(2, 5); num(`${fa(b)} تا ${fa(a)}تا داشته باشیم؛ جمعاً چندتاست؟`, a*b); }
        break;
      }
      case 'L-41': {
        for (let k = 0; k < 3; k++) { const r = ri(2, 6), c = ri(2, 6); num(`${fa(r)} ردیفِ ${fa(c)}تایی صندلی داریم؛ چند صندلی است؟`, r*c, 'آرایه: ردیف × ستون.'); }
        { const r = ri(2, 4), c = ri(2, 4); mcq(`کدام نشان‌دهندهٔ ${fa(r)} دستهٔ ${fa(c)}تایی است؟`, Array(r).fill(fa(c)).join(' + '), [Array(r+1).fill(fa(c)).join(' + '), Array(Math.max(2,r)).fill(fa(c+1)).join(' + '), `${fa(r)} + ${fa(c)}`]); }
        for (let k = 0; k < 3; k++) { const r = ri(2, 6), c = ri(2, 6); num(`${fa(r)} دستهٔ ${fa(c)}تایی توپ؛ جمعاً چند توپ؟`, r*c); }
        { const r = ri(2, 5), c = ri(2, 5); num(`آرایه‌ای با ${fa(r)} سطر و ${fa(c)} ستون؛ چند خانه دارد؟`, r*c); }
        break;
      }
      case 'L-42': {
        for (let k = 0; k < 4; k++) { const n = ri(2, 6), x = ri(2, 9); num(`${Array(n).fill(fa(x)).join(' + ')} = ؟`, n*x, 'همان ' + fa(n) + ' × ' + fa(x) + ' است.'); }
        for (let k = 0; k < 2; k++) { const n = ri(2, 9), x = ri(2, 9); num(`${fa(n)} × ${fa(x)} = ؟`, n*x); }
        { const n = ri(3, 5), x = ri(3, 8); mcq(`${fa(n)} × ${fa(x)} کدام جمع تکراری است؟`, Array(n).fill(fa(x)).join(' + '), [Array(n).fill(fa(x+1)).join(' + '), Array(x).fill(fa(n)).join(' + '), Array(n+1).fill(fa(x)).join(' + ')]); }
        { const n = ri(3, 6), x = ri(3, 8); mcq(`${Array(n).fill(fa(x)).join(' + ')} با کدام ضرب نوشته می‌شود؟`, `${fa(n)} × ${fa(x)}`, [`${fa(n+1)} × ${fa(x)}`, `${fa(n)} × ${fa(x+1)}`, `${fa(n)} + ${fa(x)}`]); }
        break;
      }
      case 'L-43': {
        for (let k = 0; k < 8; k++) { const a = ri(2, 9), b = ri(2, 9); num(`${fa(a)} × ${fa(b)} = ؟`, a*b, 'از جدول ضرب.'); }
        break;
      }
      case 'L-44': {
        { const a = ri(3, 9), b = ri(2, 9); mcq(`${fa(a)} × ${fa(b)} همان حاصلِ کدام است؟`, `${fa(b)} × ${fa(a)}`, [`${fa(a)} + ${fa(b)}`, `${fa(a+b)} × ${fa(a)}`, `${fa(Math.abs(a-b))} × ${fa(a)}`], 'ترتیب عامل‌ها حاصل را عوض نمی‌کند.'); }
        for (let k = 0; k < 3; k++) { const a = ri(2, 9), b = ri(2, 9); num(`${fa(a)} × ${fa(b)} = ؟`, a*b); }
        { const a = ri(2, 5); mcq(`اگر ${fa(a)} × ۷ = ${fa(a*7)} باشد، ۷ × ${fa(a)} چند است؟`, a*7, [a*7+7, a*7-1, 7+a]); }
        { const a = ri(2, 4); num(`برای حسابِ ${fa(a*2)} × ۳ می‌نویسیم: ${fa(a*2)}×۲ + ${fa(a*2)}×۱ = ؟`, a*2*3, 'شکستن عامل: ۳ = ۲ + ۱.'); }
        for (let k = 0; k < 3; k++) { const a = ri(2, 9), b = ri(2, 9); num(`${fa(a)} × ${fa(b)} = ؟`, a*b); }
        break;
      }
      case 'L-81': {
        for (let k = 0; k < 3; k++) { const a = ri(2, 9); num(`${fa(a)} × ۱۰ = ؟`, a*10, 'یک صفر اضافه می‌شود.'); }
        for (let k = 0; k < 2; k++) { const a = ri(2, 9); num(`${fa(a)} × ۰ = ؟`, 0, 'ضرب در صفر صفر است.'); }
        for (let k = 0; k < 2; k++) { const a = ri(2, 9); num(`${fa(a)} × ۱ = ؟`, a, 'ضرب در یک خودِ عدد است.'); }
        { const a = ri(2, 9); num(`۱۰ × ${fa(a)} = ؟`, a*10); }
        break;
      }
      case 'L-82': {
        for (let k = 0; k < 4; k++) { const a = ri(2, 9), b = ri(12, 49); num(`${fa(a)} × ${fa(b)} = ؟`, a*b, `${fa(a)} × ${fa(b - b%10)} را حساب کن و ${fa(a)} × ${fa(b%10)} را اضافه کن.`); }
        for (let k = 0; k < 2; k++) { const a = ri(2, 5), b = ri(121, 329); num(`${fa(a)} × ${fa(b)} = ؟`, a*b); }
        for (let k = 0; k < 2; k++) { const a = ri(3, 9), b = ri(11, 29); num(`${fa(a)} × ${fa(b)} = ؟`, a*b); }
        break;
      }
      case 'L-83': {
        { const a = ri(3, 9), b = ri(21, 89); const br = Math.round(b/10)*10; mcq(`برای وارسیِ ${fa(a)} × ${fa(b)}، کدام تقریب خوب است؟`, `${fa(a)} × ${fa(br)}`, [`${fa(a)} × ${fa(b+2)}`, `${fa(a+1)} × ${fa(b)}`, `${fa(a)} × ${fa(Math.floor(b/10))}`], `${fa(b)} را به نزدیک‌ترین ده‌تا گرد کن.`); }
        for (let k = 0; k < 4; k++) { const a = ri(3, 9), b = ri(21, 89); const br = Math.round(b/10)*10; num(`اول گرد کن و تقریب بزن: ${fa(a)} × ${fa(b)} ≈ ${fa(a)} × ${fa(br)} = ؟`, a*br, `تقریب، جوابِ نزدیک می‌دهد نه دقیق.`); }
        { const a = ri(3, 9), b = ri(21, 89); const br = Math.round(b/10)*10; num(`تقریب ${fa(a)} × ${fa(b)} چند است؟ (با ${fa(br)})`, a*br); }
        for (let k = 0; k < 2; k++) { const a = ri(2, 9), b = ri(2, 9); num(`وارسی: ${fa(a)} × ${fa(b)} = ؟`, a*b); }
        break;
      }
      case 'L-D1': {
        for (let k = 0; k < 4; k++) { const b = ri(2, 9), r = ri(2, 9); num(`${fa(b*r)} ÷ ${fa(b)} = ؟`, r, `کدام × ${fa(b)} می‌شود ${fa(b*r)}؟`); }
        for (let k = 0; k < 3; k++) { const b = ri(2, 9), r = ri(2, 9); num(`${fa(b*r)} شیرینی را بین ${fa(b)} نفر مساوی تقسیم کن؛ سهم هر نفر؟`, r); }
        { const b = ri(2, 9), r = ri(2, 9); mcq(`${fa(b*r)} ÷ ${fa(b)} = ؟`, r, [r+1, r-1, b]); }
        break;
      }
      case 'L-D2': {
        { const b = ri(3, 9), r = ri(1, b-1), h = ri(2, 8); mcq(`${fa(b*h+r)} ÷ ${fa(b)}: خارج‌قسمت چند است؟`, h, [h+1, h-1, h+r]); }
        { const b = ri(3, 9), r = ri(1, b-1), h = ri(2, 8); mcq(`${fa(b*h+r)} ÷ ${fa(b)}: باقیمانده چند است؟`, r, [0, 1, b]); }
        for (let k = 0; k < 3; k++) { const b = ri(2, 9), r = ri(1, b-1), h = ri(2, 9); mcq(`${fa(b*h+r)} ÷ ${fa(b)} = ؟ (خارج‌قسمت)`, h, [h+1, h-1, h+2], `${fa(h)} × ${fa(b)} = ${fa(h*b)} و تا ${fa(b*h+r)} فاصله‌اش ${fa(r)} است.`); }
        for (let k = 0; k < 3; k++) { const b = ri(2, 9), r = ri(1, b-1), h = ri(2, 9); num(`باقیماندهٔ ${fa(b*h+r)} ÷ ${fa(b)} چند است؟`, r); }
        break;
      }
      case 'L-A1': {
        for (let k = 0; k < 3; k++) { const n = ri(1000, 9999); const place = pick([['یکان', 0], ['دهگان', 1], ['صدگان', 2], ['هزارگان', 3]]); num(`در عدد ${fa(n)}، رقمِ ${place[0]} کدام است؟`, Math.floor(n / Math.pow(10, place[1])) % 10); }
        for (let k = 0; k < 2; k++) { const n = ri(2000, 9500); const opts = [n, n-10, n-100, n+1].sort((x,y)=>x-y); mcq(`کدام عدد بزرگ‌تر است؟`, Math.max(...opts), opts.filter(x => x !== Math.max(...opts))); }
        { const n = ri(1000, 9999); num(`عدد «${faName(n)}» را با رقم بنویس.`, n, 'هزار، صد، ده و یکان را کنار هم بگذار.'); }
        for (let k = 0; k < 2; k++) { const n = ri(1000, 9999); num(`عدد ${fa(n)} را «گوشزه‌شمار» یک‌به‌یک بنویسیم، دهگانِ آن چند است؟`, Math.floor(n/10)%10); }
        break;
      }
      case 'L-A2': {
        for (let k = 0; k < 4; k++) { const a = ri(1200, 4900), b = ri(1100, 3800); num(`${fa(a)} + ${fa(b)} = ؟`, a+b, 'یکان زیر یکان، دهگان زیر دهگان...'); }
        for (let k = 0; k < 4; k++) { const a = ri(3200, 9900), b = ri(1100, 2900); num(`${fa(a)} − ${fa(b)} = ؟`, a-b, 'اگر یکان کم آمد، از مرتبهٔ بالا قرض بگیر.'); }
        break;
      }
      case 'L-B1': {
        for (let k = 0; k < 2; k++) { const a = ri(2, 12)*2; num(`نیمِ ${fa(a)} چند است؟`, a/2, 'نیم یعنی تقسیم بر ۲.'); }
        for (let k = 0; k < 2; k++) { const k4 = ri(2, 6); num(`یک‌چهارمِ ${fa(4*k4)} چند است؟`, k4, 'یک‌چهارم یعنی تقسیم بر ۴.'); }
        { const k = ri(1, 3); mcq(`شکل زیر ${fa(4)} بخش مساوی دارد و ${fa(k)} بخشش رنگ‌شده است. کدام کسر رنگ‌شده است؟`, `${fa(k)} از ۴`, [`${fa(4-k)} از ۴`, `${fa(k)} از ${fa(4+k)}`, `۴ از ${fa(k)}`], 'بالای کسر: بخش‌های رنگی؛ پایین: همهٔ بخش‌های مساوی.'); }
        { const a = ri(2, 5), b = a + ri(1, 4); mcq(`کدام کسر بزرگ‌تر است؟`, `یک‌${ONES[a]}م`, [`یک‌${ONES[b]}م`, 'برابرند', 'نمی‌دانم'], 'هر چه کلّ به بخش‌های بیشتری تقسیم شود، هر بخش کوچک‌تر است.'); }
        { const n = ri(2, 10)*2; num(`در محور، نیمهٔ فاصلهٔ ۰ تا ${fa(n)} کدام عدد است؟`, n/2); }
        break;
      }
      case 'L-C1': {
        num('مثلث چند ضلع دارد؟', 3);
        { const s = ri(3, 9); num(`محیط مربعی با ضلع ${fa(s)} چند است؟`, 4*s, 'محیط مربع = ضلع × ۴.'); }
        { const a = ri(4, 12), b = ri(2, 8); num(`محیط مستطیلی با طول ${fa(a)} و عرض ${fa(b)} چند است؟`, 2*(a+b), 'دو تا (طول + عرض).'); }
        mcq('مضاعفِ مربع کدام شکل است؟', '◼️ مربع', ['⬤ دایره', '▲ مثلث', '⬟ پنج‌ضلعی'], 'مضاعف یعنی دو تا از همان شکل کنار هم — مربع دو مربع می‌شود مربعِ کشیده (مستطیل).');
        num('مربع چند خط تقارن دارد؟', 4, 'با تا کردن کاغذ مربعی امتحان کن.');
        mcq('دایره چند خط تقارن دارد؟', 'بی‌شمار', ['هیچ', 'فقط ۱', 'دقیقاً ۴']);
        break;
      }
      case 'L-E1': {
        for (let k = 0; k < 2; k++) { const m = ri(2, 9); num(`${fa(m)} متر = چند سانتی‌متر؟`, m*100, 'هر متر ۱۰۰ سانتی‌متر است.'); }
        for (let k = 0; k < 2; k++) { const h = ri(2, 9); num(`${fa(h)} ساعت = چند دقیقه؟`, h*60, 'هر ساعت ۶۰ دقیقه است.'); }
        { const kg = ri(2, 5); num(`${fa(kg)} کیلوگرم = چند گرم؟`, kg*1000, 'هر کیلوگرم ۱۰۰۰ گرم است.'); }
        { const h = ri(1, 5); num(`${fa(h)} ساعت و ۳۰ دقیقه = چند دقیقه؟`, h*60+30); }
        { const m = ri(1, 5); num(`${fa(m)} متر و ۲۰ سانتی‌متر = چند سانتی‌متر؟`, m*100+20); }
        mcq('مناسب‌ترین واحد برای وزنِ یک کیف سیب کدام است؟', 'کیلوگرم', ['گرم', 'متر', 'لیتر']);
        break;
      }
      case 'L-F1': {
        mcq('با پرتاب تاسِ معمولی (۱ تا ۶)، آوردنِ عدد ۷ چه جوابی دارد؟', 'ناممکن است', ['خیلی محتمل است', 'محتمل است', 'کم‌محتمل است'], 'روی تاس اصلاً ۷ نداریم.');
        mcq('پرتاب یک سکه ممکن است چه نتیجه‌ای بدهد؟', 'شیر یا خط', ['فقط شیر', 'فقط خط', 'شیر، خط یا ۳']);
        { const k = ri(2, 5); num(`در نمودار تصویری، هر 🍎 نشانِ ${fa(2)} سیب است. ${fa(k)} نشان چند سیب است؟`, 2*k, 'هر نشان ۲ تا، پس دوبار بشمار.'); }
        { const a = ri(3, 7), b = ri(1, 3); mcq(`کیسه‌ای داریم با ${fa(a)} توپ قرمز و ${fa(b)} توپ زرد. برداشتنِ کدام محتمل‌تر است؟`, 'توپ قرمز', ['توپ زرد', 'هر دو برابر', 'هیچ‌کدام'], 'تعداد بیشتر = احتمال بیشتر.'); }
        { const a = ri(3, 8), b = ri(2, 6); num(`در جدول سفره‌ها: 🎈 = ${fa(a)} و 🎊 = ${fa(b)}. جمعاً چند شکل است؟`, a+b); }
        for (let k = 0; k < 3; k++) { const a = ri(2, 9), b = ri(2, 9); num(`${fa(a)} دستهٔ ${fa(b)}تایی مهره داریم؛ چند مهره؟`, a*b); }
        break;
      }
    }
    return q;
  }

  // ───────────────────────── وضعیت و ذخیره ─────────────────────────
  let state = { view: 'list', lesson: null, questions: [], idx: 0, score: 0, answered: false };
  function loadProgress() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } }
  function saveBest(lessonId, pct) {
    const p = loadProgress();
    if (!p[lessonId] || pct > p[lessonId].pct) p[lessonId] = { pct, stars: pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0, at: Date.now() };
    try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch { /* حافظه اختیاری */ }
  }
  const starsFor = (pct) => (pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0);

  // هم‌ترازی با خشاب: عنوان/وضعیت رسمی درس‌ها را از خشاب می‌خوانیم (اگر در دسترس بود)
  async function syncCartridge() {
    try {
      const res = await fetch('cartridges/KH-G3-MATH.json', { cache: 'no-store' });
      if (!res.ok) return;
      const c = await res.json();
      const bm = Array.isArray(c.bookMap) ? c.bookMap : [];
      for (const row of bm) {
        const id = row.lessonId || row.id;
        const l = LESSONS.find((x) => x.id === id);
        if (!l) continue;
        if (row.titleFa || row.title) l.title = row.titleFa || row.title;
        const g = String(row.gateLevel || row.status || '');
        l.draft = !(g.includes('تأیید') && !g.includes('نیاز'));
      }
    } catch { /* حالت آفلاینِ خالص — داده‌های داخلی استفاده می‌شود */ }
  }

  // ───────────────────────── رندر ─────────────────────────
  const app = document.getElementById('app');

  function renderList() {
    const progress = loadProgress();
    const units = [...new Set(LESSONS.map((l) => l.unit))];
    app.innerHTML = units.map((u) => `
      <div class="unit-title">📖 ${u}</div>
      <div class="grid">
        ${LESSONS.filter((l) => l.unit === u).map((l, i) => {
          const pr = progress[l.id];
          const st = pr ? '⭐'.repeat(pr.stars) + '☆'.repeat(3 - pr.stars) : '';
          return `
          <button type="button" class="lesson" data-lesson="${l.id}" aria-label="شروع تمرین ${l.title}">
            <span class="num">${fa(LESSONS.indexOf(l) + 1)} — درس</span>
            <span class="title">${l.title}</span>
            <span class="meta">
              <span class="chip ${l.draft ? 'draft' : 'ok'}">${l.draft ? 'آزمایشی — نیازمند تأیید معلم' : 'تأییدشدهٔ تألیف'}</span>
              ${pr ? `<span class="stars">${st}</span><span class="best">بهترین: ${fa(pr.pct)}٪</span>` : '<span class="best">شروع نشده</span>'}
            </span>
          </button>`;
        }).join('')}
      </div>`).join('');
    app.querySelectorAll('[data-lesson]').forEach((el) =>
      el.addEventListener('click', () => startLesson(el.getAttribute('data-lesson'))));
  }

  function startLesson(id) {
    const lesson = LESSONS.find((l) => l.id === id);
    let questions = gen(id);
    if (!questions.length) questions = gen('L-43');
    questions = shuffle(questions).slice(0, QCOUNT);
    state = { view: 'quiz', lesson, questions, idx: 0, score: 0, answered: false };
    renderQuiz();
  }

  function renderQuiz() {
    const q = state.questions[state.idx];
    const pct = Math.round(100 * state.idx / QCOUNT);
    app.innerHTML = `
      <div class="quiz-card">
        <div class="qhead"><span>درس: ${state.lesson.title}</span><span>سؤال ${fa(state.idx + 1)} از ${fa(QCOUNT)}</span></div>
        <div class="qbar"><span style="width:${pct}%"></span></div>
        ${q.visual ? `<div class="visual">${q.visual}</div>` : ''}
        <div class="qtext">${q.text}</div>
        ${q.type === 'mcq'
          ? `<div class="opts">${q.options.map((o, i) => `<button type="button" class="opt" data-i="${i}">${o}</button>`).join('')}</div>`
          : `<div class="numrow"><input id="num-in" inputmode="numeric" autocomplete="off" aria-label="پاسخ" placeholder="پاسخ؟"><button type="button" class="btn primary" id="num-go">پاسخ</button></div>`}
        <div class="feedback" id="feedback"></div>
        <button type="button" class="btn primary nextbtn" id="next-btn">${state.idx + 1 === QCOUNT ? 'دیدن نتیجه 🎉' : 'سؤال بعدی ←'}</button>
      </div>`;

    const feedback = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');

    function answer(given) {
      if (state.answered) return;
      state.answered = true;
      const ok = en(String(given).trim()) === en(q.answer);
      if (ok) state.score++;
      feedback.className = 'feedback ' + (ok ? 'good' : 'bad');
      feedback.innerHTML = ok
        ? pick(['✅ آفرین!', '✅ درست است!', '✅ عالی بود!']) + (q.hint ? ` <small style="color:#94a3b8">${q.hint}</small>` : '')
        : `❌ پاسخ درست: <strong>${q.answer}</strong>${q.hint ? ` <small style="color:#94a3b8">${q.hint}</small>` : ''}`;
      if (q.type === 'mcq') {
        app.querySelectorAll('.opt').forEach((b) => {
          b.disabled = true;
          if (en(b.textContent.trim()) === en(q.answer)) b.classList.add('correct');
          else if (b.textContent.trim() === String(given)) b.classList.add('wrong');
        });
      } else {
        const inp = document.getElementById('num-in');
        if (inp) { inp.disabled = true; inp.value = given; }
      }
      nextBtn.style.display = 'block';
      nextBtn.focus();
    }

    if (q.type === 'mcq') {
      app.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => answer(b.textContent.trim())));
    } else {
      const go = () => answer(document.getElementById('num-in').value);
      document.getElementById('num-go').addEventListener('click', go);
      document.getElementById('num-in').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
      document.getElementById('num-in').focus();
    }

    nextBtn.addEventListener('click', () => {
      state.idx++;
      state.answered = false;
      if (state.idx >= QCOUNT) renderResult();
      else renderQuiz();
    });
  }

  function renderResult() {
    const pct = Math.round(100 * state.score / QCOUNT);
    const st = starsFor(pct);
    saveBest(state.lesson.id, pct);
    const msgs = st === 3 ? 'درخشیدی! ایستگاه به تو افتخار می‌کند 🚀' : st === 2 ? 'خیلی خوب بود! یک تلاش دیگر تا ستاره‌های کامل ⭐' : st === 1 ? 'خوب تلاش کردی؛ با تکرار قوی‌تر می‌شوی 💪' : 'اشکالی ندارد؛ دوباره امتحان کن — تمرین قهرمان‌ها همین است 🌱';
    app.innerHTML = `
      <div class="quiz-card result">
        <div class="big">${st === 3 ? '🏆' : st === 2 ? '🌟' : st === 1 ? '🌱' : '🛠️'}</div>
        <div class="stars" style="font-size:1.6rem;margin-top:8px">⭐${'⭐'.repeat(st)}${'☆'.repeat(3 - st)}</div>
        <div class="score">${fa(state.score)} پاسخ درست از ${fa(QCOUNT)} — ${fa(pct)}٪</div>
        <div class="msg">${msgs}</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button type="button" class="btn primary" id="retry">🔁 تلاش دوباره</button>
          <button type="button" class="btn" id="back">📖 فهرست درس‌ها</button>
          <a class="btn" href="v10.html">🚀 ایستگاه ضرب</a>
        </div>
      </div>`;
    document.getElementById('retry').addEventListener('click', () => startLesson(state.lesson.id));
    document.getElementById('back').addEventListener('click', () => { state.view = 'list'; renderList(); });
  }

  syncCartridge().then(renderList);
  </script>
</body>
</html>
