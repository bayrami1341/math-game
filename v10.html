<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>کارگاه ضرب — نسخهٔ ۱۰.۲</title>
  <link rel="stylesheet" href="styles/v10.css">
  <script src="v9-config.js" defer></script>
  <script src="src/v10/app.js" type="module"></script>
</head>
<body>
  <header>
    <div class="header-shell">
      <div class="brand-title">✦ ایستگاه یادگیری ۱۰.۲</div>
      <div class="header-actions">
        <span id="identity-display" class="identity-badge"></span>
        <button id="toggle-sound" class="secondary-button" type="button" aria-pressed="false">صدا: خاموش</button>
      </div>
    </div>
  </header>

  <p id="notice" role="status" aria-live="polite" hidden></p>

  <main class="main-shell">
    <section id="login-card" class="teacher-card" hidden>
      <h2>ورود به ایستگاه</h2>
      <p>در حال برقراری ارتباط...</p>
    </section>

    <div id="workspace">
      <!-- Profile picker if multiple child profiles exist -->
      <section id="profile-picker" class="teacher-card" hidden>
        <h2>انتخاب قهرمان</h2>
        <div id="profile-buttons"></div>
      </section>

      <!-- Teacher Shell (Strictly separate from Child Shell) -->
      <section id="teacher-shell" class="teacher-panel" hidden>
        <div class="teacher-card">
          <h2>کلاس‌های من</h2>
          <p id="teacher-summary"></p>
        </div>
        <div class="teacher-card">
          <h2>اعضا و پیوند دعوت</h2>
          <div id="teacher-members"></div>
        </div>
        <div class="teacher-card">
          <h2>کارت‌های تشخیصی بالینی</h2>
          <div id="teacher-cards-container"></div>
        </div>
      </section>

      <!-- Child Shell (Map is Home) -->
      <section id="child-shell">
        <!-- View A: Map View -->
        <div id="station-map-view">
          <div class="station-map-container" aria-label="نقشه ایستگاه">
            <div class="buildings-track">
              <!-- Building 1: Power Station (Bottom) -->
              <button id="building-power" class="building-node" type="button" aria-label="نیروگاه"></button>
              
              <!-- Connector Path 1 -->
              <div id="path-1" class="path-connector" aria-hidden="true"></div>

              <!-- Building 2: Communication Tower (Center) -->
              <button id="building-tower" class="building-node" type="button" aria-label="برج ارتباط"></button>

              <!-- Connector Path 2 -->
              <div id="path-2" class="path-connector" aria-hidden="true"></div>

              <!-- Building 3: Launch Pad (Top) -->
              <button id="building-pad" class="building-node" type="button" aria-label="سکوی پرتاب"></button>
            </div>
          </div>

          <!-- Bottom Sheet (ورق پایین نقشه) -->
          <div class="bottom-sheet" id="station-bottom-sheet">
            <p id="sheet-text" class="sheet-story"></p>
            <div class="sheet-actions">
              <!-- Momentary Main Button -->
              <button id="sheet-main-button" class="primary-button" type="button">ادامهٔ چراغ‌ها</button>
              <button id="map-guide-button" class="secondary-button" type="button">راهنما</button>
              <button id="open-board-button" class="secondary-button" type="button">کلاس من</button>
            </div>
            <div id="map-guide-info" class="guide-box" hidden>
<div id="station-finish-view" class="station-finish" hidden>`n  <p id="finish-narrative"></p>`n</div>
              ورق پایین وضعیت هر بنا را می‌گوید. با پاسخ‌های پذیرفته، سلول‌ها پر می‌شوند.
            </div>
          </div>
        </div>

        <!-- View B: Question View -->
        <div id="question-view" class="question-container" hidden>
          <div class="question-header">
            <div>
              <strong id="question-building-name"></strong>
              <span id="question-sensation" class="building-indicator"></span>
            </div>
            <button id="question-abandon" class="secondary-button" type="button">← برگشت به نقشه</button>
          </div>

          <!-- Cell Energy Progress -->
          <div id="question-cells" class="question-cells-row" aria-label="سلول‌های انرژی"></div>

          <!-- CPA Visual Representation Layer -->
          <div id="question-visual" class="question-visual" hidden aria-hidden="true"></div>

          <!-- Problem Presentation -->
          <div id="question-equation" class="math-equation"></div>

          <form id="question-form" class="answer-form">
            <label for="answer-input" class="sr-only">پاسخ:</label>
            <input id="answer-input" type="text" inputmode="numeric" autocomplete="off" required>
            <button class="primary-button" type="submit">ثبت پاسخ</button>
            <button id="question-guide-button" class="secondary-button" type="button">💡 راهنما</button>
          </form>

          <p id="question-feedback" class="question-feedback" role="status" aria-live="polite"></p>

          <!-- Question Guide Area (Equal Groups Visual, No digits) -->
          <div id="question-guide-area" hidden></div>
        </div>
      </section>
    </div>

    <!-- Class Board Modal (کلاس من فقط تا تابلو) -->
    <div id="board-dialog" class="board-dialog" hidden>
      <div class="dialog-card">
        <h3>تابلوی نتایج کلاس</h3>
        <p>بهترین دستاورد اعضای کلاس در سه بنای ایستگاه.</p>
        <button id="close-board-button" class="secondary-button" type="button">بستن تابلو</button>
      </div>
    </div>
  </main>
</body>
</html>
