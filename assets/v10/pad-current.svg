<svg class="station-svg pad-svg state-current" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="pad-current-shuttle" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#163850"/>
            <stop offset="55%" stop-color="#10293d"/>
            <stop offset="100%" stop-color="#0b1e2e"/>
          </linearGradient>
        </defs>
        
    <circle cx="100" cy="100" r="92" fill="none" stroke="#7ef0ff" stroke-width="1.5" stroke-opacity="0.28" />
    <circle cx="100" cy="100" r="86" fill="none" stroke="#7ef0ff" stroke-width="4" stroke-dasharray="12 8" stroke-linecap="round" class="current-halo">
      <animate attributeName="stroke-dashoffset" values="0;40" dur="2.2s" repeatCount="indefinite" />
    </circle>
  
        <!-- سکوی ایزومتریک پرتاب و دریچه‌های هدایت سوخت -->
        <ellipse cx="100" cy="164" rx="70" ry="14" fill="#7ef0ff" fill-opacity="0.16"/>
        <polygon points="24,148 100,166 176,148 158,134 42,134" fill="#10293d" stroke="#7ef0ff" stroke-width="2.4" stroke-linejoin="round"/>
        <polygon points="24,148 100,166 100,176 24,158" fill="#0b1e2e" stroke="#7ef0ff" stroke-width="2.2" stroke-linejoin="round"/>
        <polygon points="176,148 100,166 100,176 176,158" fill="#163850" stroke="#7ef0ff" stroke-width="2.2" stroke-linejoin="round"/>
        <rect x="86" y="154" width="28" height="5" rx="2.5" fill="#7ef0ff" fill-opacity="0.95"/>
        <!-- مخزن کپسول سوخت در سمت چپ سکو -->
        <rect x="38" y="106" width="16" height="34" rx="6" fill="#0b1e2e" stroke="#7ef0ff" stroke-width="2"/>
        <rect x="42" y="112" width="8" height="22" rx="3" fill="#5ee0b5" fill-opacity="0.95"/>
        <path d="M 46 106 L 46 76 L 68 76" fill="none" stroke="#7ef0ff" stroke-width="2.5" stroke-linejoin="round"/>
        <!-- دکل ایزومتریک مهار و سوخت‌رسانی در سمت راست -->
        <polygon points="136,34 156,34 156,142 136,142" fill="#0b1e2e" stroke="#7ef0ff" stroke-width="2.2" stroke-linejoin="round"/>
        <rect x="132" y="30" width="28" height="6" rx="2" fill="#163850" stroke="#7ef0ff" stroke-width="2"/>
        <line x1="136" y1="52" x2="156" y2="70" stroke="#7ef0ff" stroke-width="1.8"/>
        <line x1="156" y1="52" x2="136" y2="70" stroke="#7ef0ff" stroke-width="1.8"/>
        <line x1="136" y1="74" x2="156" y2="92" stroke="#7ef0ff" stroke-width="1.8"/>
        <line x1="156" y1="74" x2="136" y2="92" stroke="#7ef0ff" stroke-width="1.8"/>
        <line x1="136" y1="96" x2="156" y2="114" stroke="#7ef0ff" stroke-width="1.8"/>
        <line x1="156" y1="96" x2="136" y2="114" stroke="#7ef0ff" stroke-width="1.8"/>
        <!-- بازوی افقی اتصال سوخت به بدنه سفینه -->
        <rect x="104" y="60" width="32" height="7" rx="2" fill="#10293d" stroke="#7ef0ff" stroke-width="2"/>
        <line x1="106" y1="63.5" x2="134" y2="63.5" stroke="#7ef0ff" stroke-width="2.4" stroke-opacity="0.95"/>
        <!-- سفینه فضایی ایستاده روی سکو (آرام، بدون شعله و بدون پرواز به بیرون نقشه) -->
        <!-- بال‌های دلتا چپ و راست -->
        <polygon points="72,86 48,124 72,130" fill="#10293d" stroke="#7ef0ff" stroke-width="2.2" stroke-linejoin="round"/>
        <polygon points="108,86 132,124 108,130" fill="#0b1e2e" stroke="#7ef0ff" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- پایه‌های فرود ایستاده روی سکو -->
        <rect x="74" y="132" width="8" height="10" rx="1.5" fill="#1d4358" stroke="#7ef0ff" stroke-width="1.8"/>
        <rect x="98" y="132" width="8" height="10" rx="1.5" fill="#1d4358" stroke="#7ef0ff" stroke-width="1.8"/>
        <!-- بدنه اصلی فضاپیما -->
        <path d="M 90 28 C 104 44, 110 76, 110 132 L 70 132 C 70 76, 76 44, 90 28 Z" fill="url(#pad-current-shuttle)" stroke="#7ef0ff" stroke-width="2.6" stroke-linejoin="round"/>
        <!-- دماغه و شیشه کابین سفینه -->
        <path d="M 90 28 C 95 34, 98 42, 99 48 L 81 48 C 82 42, 85 34, 90 28 Z" fill="#071427" stroke="#7ef0ff" stroke-width="2"/>
        <path d="M 82 56 Q 90 50 98 56 L 96 64 Q 90 60 84 64 Z" fill="#7ef0ff" fill-opacity="0.95"/>
        <!-- مخزن و نشانگر عمودی اندازه سوخت روی بدنه سفینه -->
        <rect x="83" y="72" width="14" height="38" rx="6" fill="#071427" stroke="#7ef0ff" stroke-width="1.8"/>
        <rect x="86" y="76" width="8" height="30" rx="4" fill="#5ee0b5" fill-opacity="0.95"/>
        <!-- نشانگرهای باله و سکان عمودی -->
        <line x1="90" y1="112" x2="90" y2="136" stroke="#7ef0ff" stroke-width="3" stroke-linecap="round"/>
        <rect x="56" y="118" width="10" height="4" rx="2" fill="#7ef0ff" fill-opacity="0.95"/>
        <rect x="114" y="118" width="10" height="4" rx="2" fill="#7ef0ff" fill-opacity="0.95"/>
      </svg>
